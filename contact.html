<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تواصل معنا - QuickQR Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Tajawal', sans-serif; }</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between p-6">
    <div class="max-w-xl mx-auto bg-slate-800/50 border border-slate-700 rounded-2xl p-8 shadow-2xl my-8 w-full">
        <a href="index.html" class="text-indigo-400 hover:text-indigo-300 text-sm font-bold mb-6 inline-block">← العودة للرئيسية</a>
        <h1 class="text-3xl font-black mb-2 text-white">اتصل بنا</h1>
        <p class="text-slate-400 text-sm mb-6">هل لديك سؤال، استفسار، أو اقتراح؟ يسعدنا التواصل معك!</p>
        
        <form action="mailto:support@quickqr.studio" method="post" enctype="text/plain" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold mb-2 text-slate-300">الاسم الكامل:</label>
                <input type="text" name="name" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-2 text-slate-300">البريد الإلكتروني:</label>
                <input type="email" name="email" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold mb-2 text-slate-300">الرسالة:</label>
                <textarea name="message" rows="4" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500"></textarea>
            </div>
            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-xl transition-all">إرسال الرسالة</button>
        </form>
    </div>
    <footer class="text-center text-xs text-slate-500 py-4">
        © 2026 QuickQR Studio. جميع الحقوق محفوظة.
    </footer>
</body>
</html>
