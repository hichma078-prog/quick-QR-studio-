<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQR Studio - مولد أكواد QR السريع والمجاني</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-qrcode text-xl"></i>
                </div>
                <span class="font-extrabold text-xl tracking-tight text-white">QuickQR Studio</span>
            </div>
            <div class="flex items-center gap-3">
                <!-- زر تثبيت التطبيق على الهاتف (مفعل وظاهر دائماً) -->
                <button id="install-pwa-btn" type="button" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-bold py-2 px-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all cursor-pointer">
                    <i class="fa-solid fa-download"></i>
                    <span id="btn-install-text">تثبيت التطبيق</span>
                </button>

                <button type="button" onclick="toggleLanguage()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-700 cursor-pointer">
                    <i class="fa-solid fa-globe text-indigo-400"></i> <span id="lang-btn-text">English</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <div class="text-center mb-10">
            <h1 id="main-title" class="text-3xl md:text-5xl font-black mb-4 text-white">أنشئ كود QR احترافي مجاناً في ثوانٍ</h1>
            <p id="main-subtitle" class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">قم بتحويل أي رابط، نص، أو معلومات اتصال إلى رمز QR قابل للمسح بأعلى جودة.</p>
        </div>

        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 md:p-8 shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                
                <div class="md:col-span-7 space-y-6">
                    <div>
                        <label id="lbl-type" class="block text-xs font-bold text-slate-400 uppercase mb-2">نوع المحتوى</label>
                        <div class="grid grid-cols-5 gap-1.5 p-1 bg-slate-900/80 rounded-xl border border-slate-700/50">
                            <button type="button" onclick="switchTab('url')" id="btn-url" class="type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs bg-indigo-600 text-white shadow-md cursor-pointer"><i class="fa-solid fa-link mb-1"></i> <span id="lbl-t-url">رابط</span></button>
                            <button type="button" onclick="switchTab('text')" id="btn-text" class="type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-align-left mb-1"></i> <span id="lbl-t-text">نص</span></button>
                            <button type="button" onclick="switchTab('whatsapp')" id="btn-whatsapp" class="type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs text-slate-400 hover:text-white cursor-pointer"><i class="fa-brands fa-whatsapp mb-1 text-emerald-400"></i> <span id="lbl-t-wa">واتساب</span></button>
                            <button type="button" onclick="switchTab('wifi')" id="btn-wifi" class="type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-wifi mb-1"></i> <span id="lbl-t-wifi">واي فاي</span></button>
                            <button type="button" onclick="switchTab('vcard')" id="btn-vcard" class="type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-address-card mb-1"></i> <span id="lbl-t-vc">اتصال</span></button>
                        </div>
                    </div>

                    <div id="input-container" class="space-y-4">
                        <div id="sec-url" class="input-sec space-y-2">
                            <label class="block text-sm font-semibold text-slate-300">أدخل الرابط الإلكتروني:</label>
                            <input type="url" id="i-url" value="https://example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500">
                        </div>
                        <div id="sec-text" class="input-sec space-y-2 hidden">
                            <label class="block text-sm font-semibold text-slate-300">أدخل النص:</label>
                            <textarea id="i-text" rows="3" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-white outline-none focus:border-indigo-500">مرحباً بكم</textarea>
                        </div>
                        <div id="sec-whatsapp" class="input-sec space-y-3 hidden">
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">رقم الهاتف (مع رمز الدولة):</label>
                                <input type="text" id="i-wap" placeholder="212600000000" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">الرسالة التلقائية:</label>
                                <input type="text" id="i-wam" placeholder="Hello" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                        </div>
                        <div id="sec-wifi" class="input-sec space-y-3 hidden">
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">اسم شبكة الواي فاي (SSID):</label>
                                <input type="text" id="i-wifin" placeholder="NetworkName" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">كلمة المرور:</label>
                                <input type="password" id="i-wifip" placeholder="Password" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                        </div>
                        <div id="sec-vcard" class="input-sec space-y-2 hidden">
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">الاسم الكامل:</label>
                                <input type="text" id="i-vname" placeholder="Hicham" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">رقم الهاتف:</label>
                                <input type="text" id="i-vphone" placeholder="+212..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                            <div>
                                <label class="block text-xs font-semibold mb-1 text-slate-300">البريد الإلكتروني:</label>
                                <input type="email" id="i-vemail" placeholder="email@example.com" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-white text-sm outline-none">
                            </div>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-semibold mb-2 text-slate-400">لون الرمز</label>
                            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl p-1.5">
                                <input type="color" id="color-fg" value="#000000" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                                <span id="color-fg-val" class="mr-3 text-xs font-mono text-slate-300">#000000</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-2 text-slate-400">لون الخلفية</label>
                            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl p-1.5">
                                <input type="color" id="color-bg" value="#ffffff" class="w-8 h-8 rounded cursor-pointer bg-transparent border-0">
                                <span id="color-bg-val" class="mr-3 text-xs font-mono text-slate-300">#ffffff</span>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="md:col-span-5 flex flex-col items-center justify-center bg-slate-900/50 border border-slate-700/30 rounded-xl p-6">
                    <span class="text-xs font-bold text-slate-400 uppercase mb-4">معاينة الكود الناتج</span>
                    <div class="bg-white p-4 rounded-xl shadow-2xl flex items-center justify-center min-h-[190px] min-w-[190px]" id="qr-wrapper">
                        <div id="qrcode"></div>
                    </div>
                    <button type="button" onclick="downloadQR()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg transition-all cursor-pointer flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> <span id="btn-download-text">تحميل صورة (PNG)</span>
                    </button>
                </div>
            </div>
        </div>

        <div class="mt-10 bg-slate-800/30 border border-dashed border-slate-700 rounded-2xl p-6 text-center text-slate-400 text-xs">
            <span>مساحة إعلانية مخصصة (Google AdSense Space)</span>
        </div>
    </main>

    <footer class="border-t border-slate-800 bg-slate-950 py-8 text-center text-xs text-slate-500">
        <div class="max-w-4xl mx-auto px-4 space-y-4">
            <div class="flex justify-center gap-6 text-slate-400 font-medium">
                <a href="privacy.html" class="hover:text-indigo-400">سياسة الخصوصية</a>
                <span>•</span>
                <a href="contact.html" class="hover:text-indigo-400">تواصل معنا</a>
            </div>
            <p>© 2026 QuickQR Studio. جميع الحقوق محفوظة.</p>
        </div>
    </footer>

    <script>
        let currentType = 'url';
        let currentLang = 'ar';
        let deferredPrompt = null;

        const tData = {
            ar: {
                title: "أنشئ كود QR احترافي مجاناً في ثوانٍ",
                sub: "قم بتحويل أي رابط، نص، أو معلومات اتصال إلى رمز QR قابل للمسح بأعلى جودة.",
                type: "نوع المحتوى", url: "رابط", text: "نص", wa: "واتساب", wifi: "واي فاي", vc: "اتصال",
                fg: "لون الرمز", bg: "لون الخلفية", prev: "معاينة الكود الناتج", dl: "تحميل صورة (PNG)", install: "تثبيت التطبيق"
            },
            en: {
                title: "Generate Professional QR Codes for Free",
                sub: "Convert any link, text, or contact details into a high-quality QR code in seconds.",
                type: "CONTENT TYPE", url: "URL", text: "Text", wa: "WhatsApp", wifi: "Wi-Fi", vc: "Contact",
                fg: "QR Color", bg: "Background Color", prev: "QR Code Preview", dl: "Download (PNG)", install: "Install App"
            }
        };

        function switchTab(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = 'type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs text-slate-400 hover:text-white cursor-pointer';
            });
            const activeBtn = document.getElementById(`btn-${type}`);
            if (activeBtn) {
                activeBtn.className = 'type-btn flex flex-col items-center justify-center py-2 px-1 rounded-lg text-xs bg-indigo-600 text-white shadow-md cursor-pointer';
            }
            document.querySelectorAll('.input-sec').forEach(s => s.classList.add('hidden'));
            const targetSec = document.getElementById(`sec-${type}`);
            if (targetSec) targetSec.classList.remove('hidden');
            generateQR();
        }

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            const root = document.getElementById('html-root');
            root.setAttribute('lang', currentLang);
            root.setAttribute('dir', currentLang === 'ar' ? 'rtl' : 'ltr');
            document.getElementById('lang-btn-text').innerText = currentLang === 'ar' ? 'English' : 'العربية';
            
            const t = tData[currentLang];
            document.getElementById('main-title').innerText = t.title;
            document.getElementById('main-subtitle').innerText = t.sub;
            document.getElementById('lbl-type').innerText = t.type;
            document.getElementById('lbl-t-url').innerText = t.url;
            document.getElementById('lbl-t-text').innerText = t.text;
            document.getElementById('lbl-t-wa').innerText = t.wa;
            document.getElementById('lbl-t-wifi').innerText = t.wifi;
            document.getElementById('lbl-t-vc').innerText = t.vc;
            document.getElementById('btn-download-text').innerText = t.dl;
            document.getElementById('btn-install-text').innerText = t.install;
        }

        function generateQR() {
            const container = document.getElementById('qrcode');
            if (!container) return;
            container.innerHTML = '';

            let content = '';
            if (currentType === 'url') {
                content = document.getElementById('i-url').value.trim();
            } else if (currentType === 'text') {
                content = document.getElementById('i-text').value.trim();
            } else if (currentType === 'whatsapp') {
                const p = document.getElementById('i-wap').value.trim();
                const m = document.getElementById('i-wam').value.trim();
                content = `https://wa.me/${p}?text=${encodeURIComponent(m)}`;
            } else if (currentType === 'wifi') {
                const n = document.getElementById('i-wifin').value.trim();
                const p = document.getElementById('i-wifip').value.trim();
                content = `WIFI:S:${n};T:WPA;P:${p};;`;
            } else if (currentType === 'vcard') {
                const n = document.getElementById('i-vname').value.trim();
                const p = document.getElementById('i-vphone').value.trim();
                const e = document.getElementById('i-vemail').value.trim();
                content = `BEGIN:VCARD\nVERSION:3.0\nFN:${n}\nTEL:${p}\nEMAIL:${e}\nEND:VCARD`;
            }

            if (!content) content = 'QuickQR Studio';

            const fg = document.getElementById('color-fg').value;
            const bg = document.getElementById('color-bg').value;
            document.getElementById('qr-wrapper').style.backgroundColor = bg;

            if (typeof QRCode !== 'undefined') {
                new QRCode(container, {
                    text: content,
                    width: 170,
                    height: 170,
                    colorDark: fg,
                    colorLight: bg,
                    correctLevel: QRCode.CorrectLevel.H
                });
            }
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const canvas = document.querySelector('#qrcode canvas');
            let src = '';
            if (img && img.src) src = img.src;
            else if (canvas) src = canvas.toDataURL("image/png");

            if (src) {
                const a = document.createElement('a');
                a.href = src;
                a.download = 'qr-code.png';
                a.click();
            }
        }

        // PWA Install Logic
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
        });

        const installBtn = document.getElementById('install-pwa-btn');
        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        console.log('App installed');
                    }
                    deferredPrompt = null;
                } else {
                    alert(currentLang === 'ar' 
                        ? 'لتثبيت التطبيق على هاتفك: اضغط على خيارات المتصفح (⋮) في الأعلى ثم اختر "الإضافة إلى الشاشة الرئيسية" (Add to Home Screen).' 
                        : 'To install on your phone: tap the browser menu (⋮) and select "Add to Home Screen".');
                }
            });
        }

        window.onload = () => {
            document.querySelectorAll('input, textarea').forEach(el => {
                el.addEventListener('input', generateQR);
            });
            const fg = document.getElementById('color-fg');
            const bg = document.getElementById('color-bg');
            fg.addEventListener('input', (e) => {
                document.getElementById('color-fg-val').innerText = e.target.value;
                generateQR();
            });
            bg.addEventListener('input', (e) => {
                document.getElementById('color-bg-val').innerText = e.target.value;
                generateQR();
            });
            switchTab('url');
        };
    </script>
</body>
</html>
