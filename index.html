<!DOCTYPE html>
<html lang="ar" dir="rtl" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<title>QuickQR Studio - مولد ماسح QR احترافي مجاني</title>
<meta name="description" content="أنشئ أكواد QR مخصصة بالألوان والشعار والإطار، حمّلها PNG أو SVG أو PDF، وامسح الأكواد بالكاميرا أو من صورة. مجاني بالكامل.">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Tajawal','Inter',sans-serif; }
  .hid { display: none !important; }
  .fld { width:100%; background:#0f172a; border:1px solid #334155; border-radius:12px; padding:10px 12px; color:#fff; outline:none; font-size:14px; }
  .fld:focus { border-color:#6366f1; }
  select.fld option { background:#0f172a; color:#fff; }
  .lbl { display:block; font-size:12px; font-weight:600; color:#cbd5e1; margin-bottom:4px; }
  .sec-title { font-size:12px; font-weight:800; color:#94a3b8; letter-spacing:.05em; text-transform:uppercase; margin-bottom:8px; }
  .tab-btn { display:flex; flex-direction:column; align-items:center; justify-content:center; padding:8px 4px; border-radius:10px; font-size:12px; font-weight:500; color:#94a3b8; background:transparent; cursor:pointer; transition:.15s; }
  .tab-btn:hover { color:#fff; }
  .tab-btn.active { background:#4f46e5; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .mode-btn { padding:10px 24px; border-radius:12px; font-weight:700; font-size:14px; color:#94a3b8; cursor:pointer; }
  .mode-btn.active { background:#4f46e5; color:#fff; box-shadow:0 4px 10px rgba(0,0,0,.3); }
  .act-btn { display:flex; align-items:center; justify-content:center; gap:6px; padding:10px 8px; border-radius:12px; font-size:12px; font-weight:700; color:#fff; background:#334155; cursor:pointer; transition:.15s; }
  .act-btn:hover { background:#475569; }
  .act-btn.primary { background:#4f46e5; } .act-btn.primary:hover { background:#6366f1; }
  .frame-box { display:inline-flex; flex-direction:column; align-items:center; gap:8px; padding:10px; border-radius:20px; border:6px solid transparent; transition:.15s; max-width:100%; }
  .frame-label { font-weight:800; font-size:15px; letter-spacing:.08em; text-transform:uppercase; }
  #qr-holder canvas, #qr-holder svg { display:block; max-width:100%; height:auto; border-radius:8px; }
  input[type=color] { width:34px; height:34px; border:0; padding:0; background:transparent; cursor:pointer; border-radius:8px; }
  .hist-item { display:flex; align-items:center; gap:6px; background:#0f172a; border:1px solid #334155; padding:6px 10px; border-radius:10px; font-size:12px; cursor:pointer; max-width:210px; }
  .hist-item:hover { border-color:#6366f1; }
  #toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px); background:#1e293b; border:1px solid #475569; color:#fff; padding:10px 18px; border-radius:12px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:100; }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
  details > summary { cursor:pointer; font-weight:700; }
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

<header class="border-b border-slate-800 bg-slate-950/70 backdrop-blur sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg"><i class="fa-solid fa-qrcode text-xl"></i></div>
      <span class="font-extrabold text-xl text-white">QuickQR Studio</span>
    </div>
    <div class="flex items-center gap-2">
      <button id="install-btn" type="button" class="flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 px-3 rounded-xl cursor-pointer">
        <i class="fa-solid fa-download"></i><span data-i18n="install">تثبيت التطبيق</span>
      </button>
      <button id="lang-btn" type="button" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold py-2 px-3 rounded-xl border border-slate-700 cursor-pointer">
        <i class="fa-solid fa-globe text-indigo-400"></i> <span id="lang-btn-text">English</span>
      </button>
    </div>
  </div>
</header>

<main class="max-w-5xl mx-auto px-4 py-10 flex-grow w-full">
  <div class="text-center mb-8">
    <h1 data-i18n="title" class="text-3xl md:text-5xl font-black mb-3 text-white leading-tight"></h1>
    <p data-i18n="sub" class="text-slate-400 text-sm md:text-base max-w-2xl mx-auto"></p>
  </div>

  <div class="flex justify-center mb-6">
    <div class="bg-slate-800 p-1.5 rounded-2xl border border-slate-700 flex gap-2">
      <button type="button" id="mode-gen" class="mode-btn active"><i class="fa-solid fa-wand-magic-sparkles mx-1"></i><span data-i18n="modeGen"></span></button>
      <button type="button" id="mode-scan" class="mode-btn"><i class="fa-solid fa-camera mx-1"></i><span data-i18n="modeScan"></span></button>
    </div>
  </div>

  <!-- ================= GENERATOR ================= -->
  <section id="view-gen" class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5 md:p-8 shadow-2xl">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8">

      <div class="lg:col-span-7 space-y-6">
        <div>
          <div class="sec-title" data-i18n="contentType"></div>
          <div class="grid grid-cols-3 sm:grid-cols-5 gap-1.5 p-1.5 bg-slate-900/80 rounded-xl border border-slate-700/50">
            <button type="button" class="tab-btn active" data-type="url"><i class="fa-solid fa-link mb-1"></i><span data-i18n="tUrl"></span></button>
            <button type="button" class="tab-btn" data-type="text"><i class="fa-solid fa-align-left mb-1"></i><span data-i18n="tText"></span></button>
            <button type="button" class="tab-btn" data-type="whatsapp"><i class="fa-brands fa-whatsapp mb-1 text-emerald-400"></i><span data-i18n="tWa"></span></button>
            <button type="button" class="tab-btn" data-type="wifi"><i class="fa-solid fa-wifi mb-1"></i><span data-i18n="tWifi"></span></button>
            <button type="button" class="tab-btn" data-type="vcard"><i class="fa-solid fa-address-card mb-1"></i><span data-i18n="tVcard"></span></button>
            <button type="button" class="tab-btn" data-type="email"><i class="fa-solid fa-envelope mb-1"></i><span data-i18n="tEmail"></span></button>
            <button type="button" class="tab-btn" data-type="sms"><i class="fa-solid fa-comment-sms mb-1"></i><span data-i18n="tSms"></span></button>
            <button type="button" class="tab-btn" data-type="phone"><i class="fa-solid fa-phone mb-1"></i><span data-i18n="tPhone"></span></button>
            <button type="button" class="tab-btn" data-type="location"><i class="fa-solid fa-location-dot mb-1"></i><span data-i18n="tLoc"></span></button>
          </div>
        </div>

        <div class="space-y-3">
          <div id="sec-url" class="input-sec">
            <label class="lbl" data-i18n="lUrl"></label>
            <input type="text" id="i-url" dir="ltr" class="fld" value="https://example.com" data-i18n-ph="phUrl">
          </div>
          <div id="sec-text" class="input-sec hid">
            <label class="lbl" data-i18n="lText"></label>
            <textarea id="i-text" rows="3" class="fld" dir="auto">QuickQR Studio</textarea>
          </div>
          <div id="sec-whatsapp" class="input-sec hid space-y-3">
            <div><label class="lbl" data-i18n="lWaPhone"></label><input type="text" id="i-wap" dir="ltr" class="fld" placeholder="212600000000"></div>
            <div><label class="lbl" data-i18n="lWaMsg"></label><input type="text" id="i-wam" dir="auto" class="fld"></div>
          </div>
          <div id="sec-wifi" class="input-sec hid space-y-3">
            <div><label class="lbl" data-i18n="lSsid"></label><input type="text" id="i-wifin" dir="ltr" class="fld" placeholder="MyHomeWiFi"></div>
            <div><label class="lbl" data-i18n="lPass"></label><input type="text" id="i-wifip" dir="ltr" class="fld" placeholder="Password123"></div>
            <div class="grid grid-cols-2 gap-3 items-end">
              <div>
                <label class="lbl" data-i18n="lEnc"></label>
                <select id="i-wifienc" class="fld">
                  <option value="WPA">WPA/WPA2/WPA3</option>
                  <option value="WEP">WEP</option>
                  <option value="nopass" data-i18n="encNone"></option>
                </select>
              </div>
              <label class="flex items-center gap-2 text-xs text-slate-300 pb-3 cursor-pointer"><input type="checkbox" id="i-wifih"> <span data-i18n="lHidden"></span></label>
            </div>
          </div>
          <div id="sec-vcard" class="input-sec hid space-y-3">
            <div><label class="lbl" data-i18n="lVName"></label><input type="text" id="i-vname" dir="auto" class="fld"></div>
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" data-i18n="lVPhone"></label><input type="text" id="i-vphone" dir="ltr" class="fld" placeholder="+212600000000"></div>
              <div><label class="lbl" data-i18n="lVEmail"></label><input type="text" id="i-vemail" dir="ltr" class="fld" placeholder="name@example.com"></div>
              <div><label class="lbl" data-i18n="lVOrg"></label><input type="text" id="i-vorg" dir="auto" class="fld"></div>
              <div><label class="lbl" data-i18n="lVSite"></label><input type="text" id="i-vsite" dir="ltr" class="fld" placeholder="https://"></div>
            </div>
          </div>
          <div id="sec-email" class="input-sec hid space-y-3">
            <div><label class="lbl" data-i18n="lMTo"></label><input type="text" id="i-mto" dir="ltr" class="fld" placeholder="name@example.com"></div>
            <div><label class="lbl" data-i18n="lMSub"></label><input type="text" id="i-msub" dir="auto" class="fld"></div>
            <div><label class="lbl" data-i18n="lMBody"></label><textarea id="i-mbody" rows="2" dir="auto" class="fld"></textarea></div>
          </div>
          <div id="sec-sms" class="input-sec hid space-y-3">
            <div><label class="lbl" data-i18n="lSmsN"></label><input type="text" id="i-smsn" dir="ltr" class="fld" placeholder="+212600000000"></div>
            <div><label class="lbl" data-i18n="lSmsM"></label><textarea id="i-smsm" rows="2" dir="auto" class="fld"></textarea></div>
          </div>
          <div id="sec-phone" class="input-sec hid">
            <label class="lbl" data-i18n="lTel"></label>
            <input type="text" id="i-tel" dir="ltr" class="fld" placeholder="+212600000000">
          </div>
          <div id="sec-location" class="input-sec hid">
            <div class="grid grid-cols-2 gap-3">
              <div><label class="lbl" data-i18n="lLat"></label><input type="text" id="i-lat" dir="ltr" class="fld" placeholder="35.7595"></div>
              <div><label class="lbl" data-i18n="lLng"></label><input type="text" id="i-lng" dir="ltr" class="fld" placeholder="-5.8340"></div>
            </div>
          </div>
        </div>

        <div class="border-t border-slate-700/50 pt-5 space-y-4">
          <div class="sec-title" data-i18n="styleTitle"></div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div>
              <label class="lbl" data-i18n="lDots"></label>
              <select id="dot-style" class="fld">
                <option value="square" data-i18n="dSquare"></option>
                <option value="rounded" data-i18n="dRounded"></option>
                <option value="dots" data-i18n="dDots"></option>
                <option value="classy" data-i18n="dClassy"></option>
                <option value="classy-rounded" data-i18n="dClassyR"></option>
                <option value="extra-rounded" data-i18n="dExtra"></option>
              </select>
            </div>
            <div>
              <label class="lbl" data-i18n="lCorner"></label>
              <select id="corner-style" class="fld">
                <option value="square" data-i18n="dSquare"></option>
                <option value="dot" data-i18n="cDot"></option>
                <option value="extra-rounded" data-i18n="dExtra"></option>
              </select>
            </div>
            <div>
              <label class="lbl" data-i18n="lCornerDot"></label>
              <select id="corner-dot-style" class="fld">
                <option value="square" data-i18n="dSquare"></option>
                <option value="dot" data-i18n="cDot"></option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-2 gap-3">
            <div>
              <label class="lbl" data-i18n="lFg"></label>
              <div class="flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-xl p-1.5">
                <input type="color" id="color-fg" value="#000000"><span id="color-fg-val" class="text-xs font-mono text-slate-300">#000000</span>
              </div>
            </div>
            <div>
              <label class="lbl" data-i18n="lBg"></label>
              <div class="flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-xl p-1.5">
                <input type="color" id="color-bg" value="#ffffff"><span id="color-bg-val" class="text-xs font-mono text-slate-300">#ffffff</span>
              </div>
            </div>
          </div>

          <div>
            <label class="flex items-center gap-2 text-xs text-slate-300 cursor-pointer"><input type="checkbox" id="use-gradient"> <span data-i18n="lGradient"></span></label>
            <div id="grad-row" class="hid mt-2 flex items-center gap-3 bg-slate-900 border border-slate-700 rounded-xl p-1.5 max-w-xs">
              <input type="color" id="color-fg2" value="#4f46e5"><span id="color-fg2-val" class="text-xs font-mono text-slate-300">#4f46e5</span>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div>
              <label class="lbl" data-i18n="lLogo"></label>
              <div class="flex gap-2">
                <button type="button" id="logo-btn" class="act-btn flex-1"><i class="fa-solid fa-image"></i><span data-i18n="uploadLogo"></span></button>
                <button type="button" id="logo-remove" class="act-btn hid" title="remove"><i class="fa-solid fa-trash"></i></button>
              </div>
              <input type="file" id="logo-file" accept="image/*" class="hid">
            </div>
            <div>
              <label class="lbl" data-i18n="lFrame"></label>
              <select id="frame-select" class="fld">
                <option value="none" data-i18n="fNone"></option>
                <option value="bottom" data-i18n="fBottom"></option>
                <option value="top" data-i18n="fTop"></option>
              </select>
            </div>
          </div>
          <div id="frame-text-row" class="hid">
            <label class="lbl" data-i18n="lFrameText"></label>
            <input type="text" id="frame-text" dir="auto" class="fld" maxlength="24" value="امسحني">
          </div>
        </div>
      </div>

      <!-- Preview column -->
      <div class="lg:col-span-5">
        <div class="bg-slate-900/50 border border-slate-700/30 rounded-xl p-5 flex flex-col items-center lg:sticky lg:top-24">
          <div class="sec-title" data-i18n="preview"></div>
          <div id="frame-box" class="frame-box" style="background:#fff">
            <div id="frame-top" class="frame-label hid"></div>
            <div id="qr-holder"><div class="text-xs text-slate-400 p-10"><i class="fa-solid fa-spinner fa-spin"></i></div></div>
            <div id="frame-bottom" class="frame-label hid"></div>
          </div>

          <div id="warn" class="hid mt-4 text-xs bg-amber-500/10 border border-amber-500/40 text-amber-300 rounded-lg p-3 w-full"></div>

          <div class="mt-5 w-full">
            <label class="lbl" data-i18n="lSize"></label>
            <select id="size-select" class="fld">
              <option value="512">512 px</option>
              <option value="1024" selected>1024 px</option>
              <option value="2048">2048 px (print)</option>
            </select>
          </div>

          <div class="mt-4 w-full grid grid-cols-3 gap-2">
            <button type="button" id="dl-png" class="act-btn primary"><i class="fa-solid fa-download"></i>PNG</button>
            <button type="button" id="dl-svg" class="act-btn primary"><i class="fa-solid fa-vector-square"></i>SVG</button>
            <button type="button" id="dl-pdf" class="act-btn primary"><i class="fa-solid fa-file-pdf"></i>PDF</button>
          </div>
          <div class="mt-2 w-full grid grid-cols-3 gap-2">
            <button type="button" id="btn-share" class="act-btn"><i class="fa-solid fa-share-nodes"></i><span data-i18n="share"></span></button>
            <button type="button" id="btn-copy" class="act-btn"><i class="fa-solid fa-copy"></i><span data-i18n="copy"></span></button>
            <button type="button" id="btn-save" class="act-btn"><i class="fa-solid fa-bookmark"></i><span data-i18n="save"></span></button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-8 border-t border-slate-700/50 pt-5">
      <div class="flex justify-between items-center mb-3">
        <div class="sec-title" style="margin:0" data-i18n="histTitle"></div>
        <button type="button" id="hist-clear" class="text-xs text-slate-500 hover:text-rose-400 cursor-pointer" data-i18n="histClear"></button>
      </div>
      <div id="history-list" class="flex gap-2 overflow-x-auto pb-2"></div>
    </div>
  </section>

  <!-- ================= SCANNER ================= -->
  <section id="view-scan" class="hid bg-slate-800/50 border border-slate-700/50 rounded-2xl p-5 md:p-8 shadow-2xl text-center">
    <h2 class="text-xl font-bold mb-4 text-white" data-i18n="scanTitle"></h2>
    <div id="reader" class="mx-auto max-w-md rounded-xl overflow-hidden border border-slate-700 bg-slate-900 min-h-[220px]"></div>
    <div id="reader-file" class="hid"></div>
    <div class="mt-4 flex flex-wrap justify-center gap-2">
      <button type="button" id="scan-toggle" class="act-btn primary px-5"><i class="fa-solid fa-camera"></i><span data-i18n="scanStart"></span></button>
      <button type="button" id="scan-file-btn" class="act-btn px-5"><i class="fa-solid fa-image"></i><span data-i18n="scanFile"></span></button>
      <input type="file" id="scan-file" accept="image/*" class="hid">
    </div>
    <div id="scan-result-box" class="hid mt-6 p-4 bg-slate-900 rounded-xl border border-slate-700 text-start">
      <p class="text-xs text-slate-400 mb-1" data-i18n="scanResult"></p>
      <p id="scan-result-text" dir="auto" class="text-indigo-300 font-mono break-all text-sm font-bold"></p>
      <div class="mt-3 flex gap-2">
        <a id="scan-result-link" href="#" target="_blank" rel="noopener noreferrer" class="hid act-btn primary px-4"><i class="fa-solid fa-arrow-up-right-from-square"></i><span data-i18n="openLink"></span></a>
        <button type="button" id="scan-copy" class="act-btn px-4"><i class="fa-solid fa-copy"></i><span data-i18n="copy"></span></button>
      </div>
    </div>
  </section>

  <!-- ================= FAQ ================= -->
  <section class="mt-12 max-w-3xl mx-auto space-y-3">
    <h2 class="text-xl font-bold text-white mb-2" data-i18n="faqTitle"></h2>
    <details class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-4"><summary data-i18n="q1"></summary><p class="mt-2 text-sm text-slate-400" data-i18n="a1"></p></details>
    <details class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-4"><summary data-i18n="q2"></summary><p class="mt-2 text-sm text-slate-400" data-i18n="a2"></p></details>
    <details class="bg-slate-800/40 border border-slate-700/50 rounded-xl p-4"><summary data-i18n="q3"></summary><p class="mt-2 text-sm text-slate-400" data-i18n="a3"></p></details>
  </section>
</main>

<footer class="border-t border-slate-800 bg-slate-950 py-8 text-center text-xs text-slate-500">
  <div class="max-w-4xl mx-auto px-4 space-y-4">
    <div class="flex justify-center gap-6 text-slate-400 font-medium">
      <a href="privacy.html" class="hover:text-indigo-400" data-i18n="privacy"></a><span>•</span>
      <a href="contact.html" class="hover:text-indigo-400" data-i18n="contact"></a>
    </div>
    <p data-i18n="rights"></p>
  </div>
</footer>

<div id="toast"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  /* ---------------- i18n ---------------- */
  var I18N = {
    ar: {
      install:'تثبيت التطبيق', title:'استوديو QR الاحترافي: أنشئ، خصّص، وامسح', sub:'أنشئ أكواد QR بألوان وشعار وإطار خاص بك، حمّلها بجودة عالية PNG أو SVG أو PDF، وامسح أي كود بالكاميرا أو من صورة.',
      modeGen:'إنشاء QR', modeScan:'مسح QR', contentType:'نوع المحتوى',
      tUrl:'رابط', tText:'نص', tWa:'واتساب', tWifi:'واي فاي', tVcard:'جهة اتصال', tEmail:'بريد', tSms:'رسالة', tPhone:'اتصال', tLoc:'موقع',
      lUrl:'أدخل الرابط:', phUrl:'https://example.com', lText:'أدخل النص:', lWaPhone:'رقم الهاتف (مع رمز الدولة):', lWaMsg:'الرسالة التلقائية:',

  function switchTab(type) {
    currentType = type;
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.classList.toggle('active', b.getAttribute('data-type') === type); });
    document.querySelectorAll('.input-sec').forEach(function (s) { s.classList.toggle('hid', s.id !== 'sec-' + type); });
    schedule();
  }
  function switchMode(mode) {
    var gen = mode === 'gen';
    $('view-gen').classList.toggle('hid', !gen); $('view-scan').classList.toggle('hid', gen);
    $('mode-gen').classList.toggle('active', gen); $('mode-scan').classList.toggle('active', !gen);
    if (gen) stopScanner(); else startScanner();
  }

  /* ---------------- scanner ---------------- */
  var scanner = null, scanning = false, fileScanner = null;
  function showScan(text) {
    $('scan-result-box').classList.remove('hid');
    $('scan-result-text').textContent = text;
    var a = $('scan-result-link');
    if (/^https?:\/\//i.test(text)) { a.href = text; a.classList.remove('hid'); a.classList.add('flex'); } else { a.classList.add('hid'); a.classList.remove('flex'); }
  }
  function setScanBtn() { $('scan-toggle').querySelector('span').textContent = t(scanning ? 'scanStop' : 'scanStart'); }
  async function startScanner() {
    try { await loadLib('scan'); } catch (e) { toast(t('toastLib')); return; }
    if (scanning) return;
    if (!scanner) scanner = new Html5Qrcode('reader');
    try {
      await scanner.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 230, height: 230 } }, function (txt) { showScan(txt); }, function () {});
      scanning = true;
    } catch (e) { console.error(e); toast(t('toastCam')); }
    setScanBtn();
  }
  async function stopScanner() {
    if (scanner && scanning) { try { await scanner.stop(); } catch (e) {} scanning = false; }
    setScanBtn();
  }
  async function scanImage(file) {
    if (!file) return;
    try {
      await loadLib('scan');
      await stopScanner();
      if (!fileScanner) fileScanner = new Html5Qrcode('reader-file');
      showScan(await fileScanner.scanFile(file, false));
    } catch (e) { toast(t('toastNoQr')); }
  }

  /* ---------------- init ---------------- */
  function init() {
    document.querySelectorAll('.tab-btn').forEach(function (b) { b.addEventListener('click', function () { switchTab(b.getAttribute('data-type')); }); });
    $('mode-gen').addEventListener('click', function () { switchMode('gen'); });
    $('mode-scan').addEventListener('click', function () { switchMode('scan'); });
    $('lang-btn').addEventListener('click', function () {
      var prev = lang; lang = lang === 'ar' ? 'en' : 'ar';
      try { localStorage.setItem('qr_lang', lang); } catch (e) {}
      applyLang(prev);
    });
    document.querySelectorAll('#view-gen input, #view-gen textarea, #view-gen select').forEach(function (el) {
      if (el.id === 'logo-file') return;
      el.addEventListener('input', schedule); el.addEventListener('change', schedule);
    });
    $('logo-btn').addEventListener('click', function () { $('logo-file').click(); });
    $('logo-file').addEventListener('change', function (e) { setLogo(e.target.files[0]); e.target.value = ''; });
    $('logo-remove').addEventListener('click', function () { logoData = ''; $('logo-remove').classList.add('hid'); qr = null; schedule(); });
    $('dl-png').addEventListener('click', doPNG);
    $('dl-svg').addEventListener('click', doSVG);
    $('dl-pdf').addEventListener('click', doPDF);
    $('btn-share').addEventListener('click', doShare);
    $('btn-copy').addEventListener('click', doCopy);
    $('btn-save').addEventListener('click', function () { saveHistory(false); });
    $('hist-clear').addEventListener('click', function () { writeHistory([]); renderHistory(); });
    $('scan-toggle').addEventListener('click', function () { scanning ? stopScanner() : startScanner(); });
    $('scan-file-btn').addEventListener('click', function () { $('scan-file').click(); });
    $('scan-file').addEventListener('change', function (e) { scanImage(e.target.files[0]); e.target.value = ''; });
    $('scan-copy').addEventListener('click', function () {
      var txt = $('scan-result-text').textContent;
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function () { toast(t('toastCopied')); });
    });

    applyLang();
    switchTab('url');
    loadLib('qr').then(render).catch(function () {
      $('qr-holder').innerHTML = '<p class="text-xs text-rose-300 p-6 text-center max-w-[220px]">' + t('toastLib') + '</p>';
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();

  /* ---------------- PWA ---------------- */
  var deferredPrompt = null, installBtn = $('install-btn');
  function hideInstall() { installBtn.classList.add('hid'); installBtn.classList.remove('flex'); }
  var isInstalled = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
  if (isInstalled) hideInstall();
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); deferredPrompt = e; });
  window.addEventListener('appinstalled', hideInstall);
  installBtn.addEventListener('click', function () {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(function (r) { deferredPrompt = null; if (r.outcome === 'accepted') hideInstall(); });
    } else {
      alert(t('installHelp'));
    }
  });
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
