<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQR Studio - مولد أكواد QR السريع والمجاني</title>
    <link rel="manifest" href="manifest.json">
    
    <!-- Tailwind CSS & FontAwesome -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- QR Code JS Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- Header / Navigation -->
    <header class="border-b border-slate-800 bg-slate-950/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-qrcode text-xl"></i>
                </div>
                <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-white to-slate-400 bg-clip-text text-transparent">
                    QuickQR Studio
                </span>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- زر تثبيت التطبيق المباشر -->
                <button id="install-pwa-btn" class="hidden items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs md:text-sm font-bold py-2 px-3.5 rounded-xl shadow-lg shadow-emerald-600/30 transition-all animate-pulse">
                    <i class="fa-solid fa-download"></i>
                    <span>تثبيت التطبيق</span>
                </button>
                
                <span class="text-xs font-semibold px-3 py-1 rounded-full bg-indigo-500/10 text-indigo-400 border border-indigo-500/20 hidden md:inline-block">
                    أداة مجانية 100%
                </span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <!-- Title & Subtitle -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-black mb-4 leading-tight text-white">
                أنشئ كود QR احترافي مجاناً في ثوانٍ
            </h1>
            <p class="text-slate-400 text-sm md:text-base max-w-xl mx-auto">
                قم بتحويل أي رابط، نص، أو معلومات اتصال إلى رمز QR قابل للمسح بأعلى جودة وتخصيص كامل للألوان.
            </p>
        </div>

        <!-- Generator Card -->
        <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-6 md:p-8 backdrop-blur-xl shadow-2xl">
            <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
                
                <!-- Controls Column -->
                <div class="md:col-span-7 space-y-6">
                    <!-- Type Selector -->
                    <div>
                        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">نوع المحتوى</label>
                        <div class="grid grid-cols-3 gap-2 p-1 bg-slate-900/80 rounded-xl border border-slate-700/50">
                            <button onclick="setType('url')" id="btn-url" class="type-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-medium text-sm transition-all bg-indigo-600 text-white shadow-md">
                                <i class="fa-solid fa-link"></i> رابط
                            </button>
                            <button onclick="setType('text')" id="btn-text" class="type-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-medium text-sm transition-all text-slate-400 hover:text-white">
                                <i class="fa-solid fa-align-left"></i> نص
                            </button>
                            <button onclick="setType('wifi')" id="btn-wifi" class="type-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-medium text-sm transition-all text-slate-400 hover:text-white">
                                <i class="fa-solid fa-wifi"></i> واي فاي
                            </button>
                        </div>
                    </div>

                    <!-- Input Fields -->
                    <div id="input-container" class="space-y-4">
                        <div id="url-input-group">
                            <label class="block text-sm font-semibold mb-2 text-slate-300">أدخل الرابط الإلكتروني:</label>
                            <input type="url" id="qr-text" placeholder="https://example.com" class="w-full bg-slate-900/90 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-white placeholder-slate-500 outline-none transition-all" value="https://example.com">
                        </div>
                    </div>

                    <!-- Color Customization -->
                    <div class="grid grid-cols-2 gap-4 pt-2">
                        <div>
                            <label class="block text-xs font-semibold mb-2 text-slate-400">لون الرمز (Foreground)</label>
                            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl p-1.5">
                                <input type="color" id="color-fg" value="#000000" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0 p-0">
                                <span id="color-fg-val" class="mr-3 text-xs font-mono text-slate-300">#000000</span>
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-2 text-slate-400">لون الخلفية (Background)</label>
                            <div class="flex items-center bg-slate-900 border border-slate-700 rounded-xl p-1.5">
                                <input type="color" id="color-bg" value="#ffffff" class="w-8 h-8 rounded-lg cursor-pointer bg-transparent border-0 p-0">
                                <span id="color-bg-val" class="mr-3 text-xs font-mono text-slate-300">#ffffff</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Preview Column -->
                <div class="md:col-span-5 flex flex-col items-center justify-center bg-slate-900/50 border border-slate-700/30 rounded-xl p-6">
                    <span class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-4">معاينة الكود الناتج</span>
                    
                    <!-- QR Wrapper -->
                    <div class="p-4 rounded-xl shadow-2xl flex items-center justify-center min-h-[200px] min-w-[200px]" id="qr-wrapper">
                        <div id="qrcode"></div>
                    </div>

                    <button onclick="downloadQR()" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 px-6 rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-download"></i> تحميل صورة (PNG)
                    </button>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800 bg-slate-950 py-6 text-center text-xs text-slate-500">
        <p>© 2026 QuickQR Studio. جميع الحقوق محفوظة.</p>
    </footer>

    <!-- JavaScript Script -->
    <script>
        let qrCodeInstance = null;
        let currentType = 'url';
        let deferredPrompt = null;

        function init() {
            const qrTextElem = document.getElementById('qr-text');
            const colorFgElem = document.getElementById('color-fg');
            const colorBgElem = document.getElementById('color-bg');

            if (qrTextElem) qrTextElem.addEventListener('input', generateQR);
            if (colorFgElem) {
                colorFgElem.addEventListener('input', (e) => {
                    document.getElementById('color-fg-val').innerText = e.target.value;
                    generateQR();
                });
            }
            if (colorBgElem) {
                colorBgElem.addEventListener('input', (e) => {
                    document.getElementById('color-bg-val').innerText = e.target.value;
                    generateQR();
                });
            }

            generateQR();
        }

        function setType(type) {
            currentType = type;
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.className = 'type-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-medium text-sm transition-all text-slate-400 hover:text-white';
            });

            const activeBtn = document.getElementById(`btn-${type}`);
            if (activeBtn) {
                activeBtn.className = 'type-btn flex items-center justify-center gap-2 py-2 px-3 rounded-lg font-medium text-sm transition-all bg-indigo-600 text-white shadow-md';
            }

            const container = document.getElementById('input-container');
            if (type === 'url') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-300">أدخل الرابط الإلكتروني:</label>
                        <input type="url" id="qr-text" placeholder="https://example.com" class="w-full bg-slate-900/90 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-white placeholder-slate-500 outline-none transition-all" value="https://example.com">
                    </div>
                `;
            } else if (type === 'text') {
                container.innerHTML = `
                    <div>
                        <label class="block text-sm font-semibold mb-2 text-slate-300">أدخل النص المطلوبة تحويله:</label>
                        <textarea id="qr-text" rows="3" placeholder="أكتب نصك هنا..." class="w-full bg-slate-900/90 border border-slate-700 focus:border-indigo-500 rounded-xl px-4 py-3 text-white placeholder-slate-500 outline-none transition-all">مرحباً بكم في QuickQR Studio</textarea>
                    </div>
                `;
            } else if (type === 'wifi') {
                container.innerHTML = `
                    <div class="space-y-3">
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-300">اسم شبكة الواي فاي (SSID):</label>
                            <input type="text" id="wifi-name" placeholder="MyHomeWiFi" class="w-full bg-slate-900/90 border border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-2 text-white text-sm outline-none">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold mb-1 text-slate-300">كلمة المرور:</label>
                            <input type="password" id="wifi-pass" placeholder="Password123" class="w-full bg-slate-900/90 border border-slate-700 focus:border-indigo-500 rounded-xl px-3 py-2 text-white text-sm outline-none">
                        </div>
                    </div>
                `;
                document.getElementById('wifi-name').addEventListener('input', generateQR);
                document.getElementById('wifi-pass').addEventListener('input', generateQR);
            }

            const newQrText = document.getElementById('qr-text');
            if (newQrText) newQrText.addEventListener('input', generateQR);

            generateQR();
        }

        function generateQR() {
            const qrContainer = document.getElementById('qrcode');
            if (!qrContainer) return;
            qrContainer.innerHTML = '';

            let qrContent = '';
            if (currentType === 'url' || currentType === 'text') {
                const textElem = document.getElementById('qr-text');
                qrContent = textElem ? textElem.value.trim() : '';
            } else if (currentType === 'wifi') {
                const name = document.getElementById('wifi-name').value.trim();
                const pass = document.getElementById('wifi-pass').value.trim();
                qrContent = `WIFI:S:${name};T:WPA;P:${pass};;`;
            }

            if (!qrContent) qrContent = 'QuickQR Studio';

            const fgColor = document.getElementById('color-fg').value;
            const bgColor = document.getElementById('color-bg').value;

            document.getElementById('qr-wrapper').style.backgroundColor = bgColor;

            qrCodeInstance = new QRCode(qrContainer, {
                text: qrContent,
                width: 180,
                height: 180,
                colorDark: fgColor,
                colorLight: bgColor,
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        function downloadQR() {
            const img = document.querySelector('#qrcode img');
            const canvas = document.querySelector('#qrcode canvas');
            let imageSrc = '';

            if (img && img.src) {
                imageSrc = img.src;
            } else if (canvas) {
                imageSrc = canvas.toDataURL("image/png");
            }

            if (imageSrc) {
                const link = document.createElement('a');
                link.href = imageSrc;
                link.download = 'quick-qr-code.png';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            }
        }

        window.onload = init;

        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('PWA Ready'))
                    .catch(err => console.log('PWA Error', err));
            });
        }

        // Catch PWA Install Prompt
        const installBtn = document.getElementById('install-pwa-btn');
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            if (installBtn) {
                installBtn.classList.remove('hidden');
                installBtn.classList.add('flex');
            }
        });

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        installBtn.classList.add('hidden');
                    }
                    deferredPrompt = null;
                }
            });
        }
    </script>
</body>
</html>
